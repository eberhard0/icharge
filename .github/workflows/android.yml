name: Android

# Every push/PR: build the app (release APK + AAB, plus a debug-signed APK for sideloading
# when no upload key is configured).
# Every v* tag: build a signed AAB + APK and attach them to a GitHub Release.
#
# Signing needs four repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
# (set with ~/hindsight-keys/set-github-secrets.sh, REPO=eberhard0/icharge).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach build outputs to the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-35
            build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Fresh station data in every build; without the key the committed snapshot is kept.
      - name: Refresh station snapshot (Open Charge Map + OpenStreetMap)
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: python3 tools/snapshot.py app/src/main/assets

      - name: Build release bundle and APK
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          # Without the upload key the release APK is unsigned (not installable);
          # build a debug-signed one as well so it can still be sideloaded.
          if [ -z "$KEYSTORE_FILE" ]; then ./gradlew --no-daemon assembleDebug; fi

      # Artifact storage on this account is often full; releases (v* tags) carry the real builds.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: icharge-${{ steps.ver.outputs.name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
